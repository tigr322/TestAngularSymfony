<section class="page-header">
  <div>
    <p class="eyebrow">Product import</p>
    <h1>Import products from XLSX</h1>
  </div>
  <a routerLink="/products" class="secondary-link">View products</a>
</section>

<section class="panel">
  <label class="file-picker">
    <span>Excel file</span>
    <input type="file" accept=".xlsx" (change)="onFileSelected($event)" />
  </label>

  <div class="selected-file" *ngIf="selectedFile">
    {{ selectedFile.name }}
  </div>

  <button type="button" (click)="submit()" [disabled]="isLoading">
    {{ isLoading ? 'Importing...' : 'Import products' }}
  </button>

  <p class="error" *ngIf="error">{{ error }}</p>
</section>

<section class="stats" *ngIf="result">
  <article>
    <span>{{ result.created }}</span>
    <p>Created</p>
  </article>
  <article>
    <span>{{ result.updated }}</span>
    <p>Updated</p>
  </article>
  <article>
    <span>{{ result.skipped }}</span>
    <p>Skipped</p>
  </article>
  <article>
    <span>{{ result.errorCount }}</span>
    <p>Errors</p>
  </article>
</section>

<section class="panel" *ngIf="result?.errors?.length">
  <h2>Row-level feedback</h2>
  <ul class="errors-list">
    <li *ngFor="let rowError of result?.errors">
      <strong>Row {{ rowError.row }}:</strong> {{ rowError.message }}
    </li>
  </ul>
</section>
