<section class="page-header">
  <div>
    <p class="eyebrow">Каталог</p>
    <h1>Импортированные товары</h1>
  </div>
  <a routerLink="/import" class="secondary-link">Импортировать XLSX</a>
</section>

<section class="panel state" *ngIf="isLoading()">Загружаем товары...</section>
<section class="panel error" *ngIf="error()">{{ error() }}</section>
<section class="panel state" *ngIf="!isLoading() && !error() && products().length === 0">
  Товары пока не импортированы.
</section>

<section class="products-grid" *ngIf="!isLoading() && !error() && products().length > 0">
  <a class="product-card" *ngFor="let product of products()" [routerLink]="['/products', product.id]">
    <div class="thumb">
      <img *ngIf="product.firstImage; else noImage" [src]="productApi.imageUrl(product.firstImage)" [alt]="product.name" />
      <ng-template #noImage><span>Нет изображения</span></ng-template>
    </div>
    <div class="product-info">
      <h2>{{ product.name }}</h2>
      <p class="code">{{ product.externalCode }}</p>
      <div class="meta">
        <span>{{ product.price }} руб.</span>
        <span *ngIf="product.discountPercent">{{ product.discountPercent }}%</span>
        <span>Изображений: {{ product.imageCount }}</span>
      </div>
    </div>
  </a>
</section>
